default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: <%= Rails.application.credentials.dig(:database, :password) %>
  host: localhost
  port: 5432

development:
  <<: *default
  database: zvyno_development

test:
  <<: *default
  database: zvyno_test

production:
  <<: *default
  database: zvyno_production
